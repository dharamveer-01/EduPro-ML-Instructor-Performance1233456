services:

  edupro-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: edupro-ml-api

    ports:
      - "8000:8000"

    environment:
      EDUPRO_BASE_DIR: /app/edupro_ml_system
      EDUPRO_API_KEY: ${EDUPRO_API_KEY}

    restart: unless-stopped

    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s